<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!--
    Workers / バインディング詳細図（2026-08-07）
    正本: cloudflare-os/packages/*/wrangler.jsonc + scripts/deploy.mjs generateConfigs + env.d.ts
    更新方法: この SVG を編集 → qlmanage -t -s 1800 -o . workers-bindings.svg → .svg.png を .png にリネーム
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <text x="750" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cloudflare OS — Workers とバインディングの詳細（2026-08-07）</text>

  <!-- ============ ブラウザ ============ -->
  <rect x="40" y="70" width="300" height="90" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="54" y="96" font-size="14" font-weight="700" fill="#0D47A1">ブラウザ（メンバー）</text>
  <text x="54" y="118" font-size="11.5" fill="#1565C0">フロント SPA をダウンロード</text>
  <text x="54" y="136" font-size="11.5" fill="#1565C0">以降は /api を WebSocket（capnweb RPC）</text>

  <!-- ============ workshop Worker（本体） ============ -->
  <rect x="40" y="190" width="620" height="470" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2"/>
  <text x="56" y="216" font-size="15" font-weight="700" fill="#E65100">cloudflare-os-workshop（本体 Worker・フロント配信 + API）</text>

  <rect x="56" y="230" width="588" height="150" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.3"/>
  <text x="70" y="252" font-size="12.5" font-weight="700" fill="#B26A00">ランタイム</text>
  <text x="70" y="274" font-size="11.5" fill="#7A4E00">・assets 配信: フロント SPA（/api, /api/*, /blueprint-screenshot/* は Worker 先行）</text>
  <text x="70" y="292" font-size="11.5" fill="#7A4E00">・認証: パスワード方式（ADMINS=["cherie"]）</text>
  <text x="70" y="310" font-size="11.5" fill="#7A4E00">・DO + SQLite（ctx.exports 経由・明示 binding 不要）:</text>
  <text x="82" y="328" font-size="11" fill="#7A4E00">UserDurableObject / OverseerDurableObject / AdminSettings / PendingLogin</text>
  <text x="70" y="348" font-size="11.5" fill="#7A4E00">・pi-ai 推論 / エージェント（webFetch 等）</text>
  <text x="70" y="366" font-size="11.5" fill="#7A4E00">・compatibility: nodejs_compat / global_fetch_strictly_public（SSRF 対策）</text>

  <rect x="56" y="392" width="588" height="96" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.3"/>
  <text x="70" y="414" font-size="12.5" font-weight="700" fill="#B26A00">vars（環境変数・デプロイ時に生成）</text>
  <text x="70" y="436" font-size="11" fill="#7A4E00">ADMINS=["cherie"]　CF_AI_GATEWAY="cloudflare-os"</text>
  <text x="70" y="454" font-size="11" fill="#7A4E00">CF_AI_GATEWAY_ACCOUNT_ID=495d8f…　CF_AI_GATEWAY_PROVIDERS="deepseek"</text>
  <text x="70" y="472" font-size="11" fill="#7A4E00">CF_AI_GATEWAY_WAI="cloudflare-os"（Workers AI ルート）</text>

  <rect x="56" y="500" width="588" height="56" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.3"/>
  <text x="70" y="522" font-size="12.5" font-weight="700" fill="#B26A00">secrets（Worker 秘匿・初回 --secrets-file）</text>
  <text x="70" y="542" font-size="11" fill="#7A4E00">CF_AI_GATEWAY_API_TOKEN（AI Gateway Run + Read）</text>

  <rect x="56" y="568" width="588" height="76" rx="8" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1.3"/>
  <text x="70" y="590" font-size="12.5" font-weight="700" fill="#374151">バインディング一覧（右列・下段へ）</text>
  <text x="70" y="612" font-size="11" fill="#4B5563">BLUEPRINTS / AVATARS / BLUEPRINT_CONTENT / BROWSER / WORKERS_AI</text>
  <text x="70" y="630" font-size="11" fill="#4B5563">LOADER / GATEKEEPER_CONTEXT / GATEKEEPER_CUSTOM / ERROR_REPORTER</text>

  <!-- ============ Tier1: ストレージ・AI 系バインディング（右列） ============ -->
  <rect x="720" y="190" width="320" height="80" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="734" y="214" font-size="13" font-weight="700" fill="#37474F">KV: BLUEPRINTS</text>
  <text x="734" y="234" font-size="11" fill="#455A64">blueprint メタデータ（ID 固定）</text>
  <text x="734" y="252" font-size="11" fill="#455A64">本番: 47d7a00d… / dev: 別名義</text>

  <rect x="720" y="286" width="320" height="80" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="734" y="310" font-size="13" font-weight="700" fill="#37474F">KV: AVATARS</text>
  <text x="734" y="330" font-size="11" fill="#455A64">ユーザーアバター画像</text>
  <text x="734" y="348" font-size="11" fill="#455A64">本番: 2dcad78a… / dev: 別名義</text>

  <rect x="720" y="382" width="320" height="80" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="734" y="406" font-size="13" font-weight="700" fill="#37474F">R2: BLUEPRINT_CONTENT</text>
  <text x="734" y="426" font-size="11" fill="#455A64">blueprint コードスナップショット</text>
  <text x="734" y="444" font-size="11" fill="#455A64">bucket: cloudflare-os-workshop-blueprint-content</text>

  <rect x="720" y="478" width="320" height="80" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="734" y="502" font-size="13" font-weight="700" fill="#37474F">BROWSER（Browser Run）</text>
  <text x="734" y="522" font-size="11" fill="#455A64">ガジェット エクスポートの PDF 等レンダリング</text>
  <text x="734" y="540" font-size="11" fill="#455A64">（Puppeteer → nodejs_compat 必要）</text>

  <rect x="720" y="574" width="320" height="80" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="734" y="598" font-size="13" font-weight="700" fill="#37474F">WORKERS_AI（AI）</text>
  <text x="734" y="618" font-size="11" fill="#455A64">タイトル生成（クイックモデル）</text>
  <text x="734" y="636" font-size="11" fill="#455A64">→ AI Gateway の Workers AI ルート経由</text>

  <!-- ============ Tier2: LOADER + service bindings（下段） ============ -->
  <rect x="720" y="680" width="320" height="110" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="734" y="704" font-size="13" font-weight="700" fill="#37474F">LOADER（Worker Loader）</text>
  <text x="734" y="724" font-size="11" fill="#455A64">ガジェットのコードを実行時に</text>
  <text x="734" y="742" font-size="11" fill="#455A64">動的 Worker としてコンパイル・起動</text>
  <text x="734" y="762" font-size="11" fill="#455A64">（Dynamic Workers・有料機能）</text>

  <rect x="1080" y="680" width="360" height="130" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="1094" y="704" font-size="13" font-weight="700" fill="#B26A00">service bindings（→ 別 Worker）</text>
  <text x="1094" y="726" font-size="11" fill="#7A4E00">GATEKEEPER_CONTEXT → cloudflare-os-context</text>
  <text x="1106" y="744" font-size="10.5" fill="#7A4E00">（GatekeeperVendor / sharingDomain="production"）</text>
  <text x="1094" y="764" font-size="11" fill="#7A4E00">GATEKEEPER_CUSTOM → cloudflare-os-custom</text>
  <text x="1106" y="782" font-size="10.5" fill="#7A4E00">（GatekeeperVendor / CUSTOM_NAME="Cherie Lab"）</text>
  <text x="1094" y="800" font-size="11" fill="#7A4E00">ERROR_REPORTER → cloudflare-os-error-reporter</text>

  <!-- 矢印: workshop → Tier1 -->
  <line x1="660" y1="230" x2="716" y2="230" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="326" x2="716" y2="326" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="422" x2="716" y2="422" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="518" x2="716" y2="518" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="614" x2="716" y2="614" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 矢印: workshop → Tier2（下方向） -->
  <line x1="880" y1="660" x2="880" y2="676" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1260" y1="660" x2="1260" y2="676" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ブラウザ → workshop -->
  <line x1="190" y1="160" x2="190" y2="186" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="198" y="180" font-size="10.5" fill="#4B5563">HTTPS / assets</text>
  <line x1="310" y1="160" x2="310" y2="186" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="180" font-size="10.5" fill="#4B5563">/api RPC（WS）</text>

  <!-- ============ モデルチェーン ============ -->
  <rect x="40" y="830" width="300" height="100" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="54" y="854" font-size="13.5" font-weight="700" fill="#92400E">AI Gateway（cloudflare-os）</text>
  <text x="54" y="874" font-size="11" fill="#92400E">custom provider: opencode-go</text>
  <text x="54" y="892" font-size="11" fill="#B45309">（base_url = relay.cherie-lab.com）</text>
  <text x="54" y="910" font-size="11" fill="#92400E">Workers AI ルート（タイトル生成）</text>

  <rect x="400" y="830" width="300" height="100" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="414" y="854" font-size="13.5" font-weight="700" fill="#B26A00">リレー Worker</text>
  <text x="414" y="874" font-size="11" fill="#7A4E00">cloudflare-os-model-relay</text>
  <text x="414" y="894" font-size="11" fill="#7A4E00">secret: OPENCODE_GO_API_KEY</text>
  <text x="414" y="912" font-size="11" fill="#7A4E00">custom domain: relay.cherie-lab.com</text>

  <rect x="760" y="830" width="300" height="100" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="774" y="854" font-size="13.5" font-weight="700" fill="#1B5E20">opencode.ai（Go プラン）</text>
  <text x="774" y="874" font-size="11" fill="#2E7D32">https://opencode.ai/zen/go/v1</text>
  <text x="774" y="894" font-size="11" fill="#2E7D32">リレー経由の直接 fetch で課金回避</text>

  <rect x="1120" y="830" width="320" height="100" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1134" y="854" font-size="13.5" font-weight="700" fill="#1B5E20">DeepSeek V4 Flash</text>
  <text x="1134" y="874" font-size="11" fill="#2E7D32">全ユーザーのデフォルトモデル</text>
  <text x="1134" y="894" font-size="11" fill="#2E7D32">キー配布なし・カタログ自動表示</text>

  <!-- workshop → gateway（緑・チャット推論） -->
  <line x1="250" y1="660" x2="250" y2="826" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="64" y="760" font-size="11.5" font-weight="700" fill="#1B5E20">チャット推論（deepseek・ゲートウェイ経由）</text>
  <line x1="340" y1="880" x2="396" y2="880" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <line x1="700" y1="880" x2="756" y2="880" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <line x1="1060" y1="880" x2="1116" y2="880" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>

  <!-- 凡例（3 行） -->
  <rect x="40" y="955" width="1400" height="92" rx="8" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1"/>
  <line x1="56" y1="976" x2="96" y2="976" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="104" y="980" font-size="11.5" fill="#374151">緑実線: チャット推論（workshop → AI Gateway → リレー → opencode.ai → DeepSeek）</text>
  <line x1="56" y1="998" x2="96" y2="998" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="104" y="1002" font-size="11.5" fill="#374151">黒実線: Worker binding（KV / R2 / BROWSER / WORKERS_AI / LOADER / GATEKEEPER_* / ERROR_REPORTER）</text>
  <line x1="56" y1="1020" x2="96" y2="1020" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="104" y="1024" font-size="11.5" fill="#374151">灰実線: ブラウザ → workshop（HTTPS / WebSocket）</text>
</svg>
