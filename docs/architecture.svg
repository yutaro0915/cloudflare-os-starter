<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 960" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <!--
    アーキテクチャ図 正本（更新していく図）
    更新方法: この SVG を編集 → タイトルの日付を更新 →
      qlmanage -t -s 1800 -o . architecture.svg（PNG 再生成）
      （旧版は architecture-v1-2026-08-06.svg に保存）
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="750" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Cloudflare OS ハブ アーキテクチャ — 現状 + 構想（2026-08-07 更新・v2）</text>

  <!-- ============ Band 1: 開発フロー ============ -->
  <!-- GitHub -->
  <rect x="40" y="70" width="420" height="130" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="54" y="96" font-size="14" font-weight="700" fill="#111827">GitHub（private・正本・2026-08-06 運用開始）</text>
  <text x="54" y="120" font-size="12.5" fill="#374151">yutaro0915/cloudflare-os-starter</text>
  <text x="54" y="140" font-size="12" fill="#4B5563">・main（本番反映） / develop（開発統合）</text>
  <text x="54" y="160" font-size="12" fill="#4B5563">└ submodule: cloudflare-os（fork f37b590）</text>
  <text x="54" y="180" font-size="12" fill="#4B5563">upstream（Cloudflare 本家）追従可</text>

  <!-- GitHub Actions -->
  <rect x="540" y="70" width="380" height="130" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="554" y="96" font-size="14" font-weight="700" fill="#111827">GitHub Actions（deploy.yml）</text>
  <text x="554" y="118" font-size="11.5" fill="#4B5563">① checkout(--recurse-submodules)</text>
  <text x="554" y="136" font-size="11.5" fill="#4B5563">② pnpm install（root + submodule）</text>
  <text x="554" y="154" font-size="11.5" fill="#4B5563">③ pnpm run check（検証ゲート）</text>
  <text x="554" y="172" font-size="11.5" fill="#4B5563">④ pnpm deploy（config 自動生成）</text>
  <text x="554" y="190" font-size="11.5" fill="#4B5563">認証: CLOUDFLARE_API_TOKEN（GitHub secret）</text>

  <!-- 構想中 -->
  <rect x="1000" y="70" width="440" height="130" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="1014" y="96" font-size="14" font-weight="700" fill="#0D47A1">構想中（青破線 = まだ無いもの）</text>
  <text x="1014" y="120" font-size="12" fill="#1565C0">・自動実装フロー: issue → エージェント →</text>
  <text x="1026" y="138" font-size="12" fill="#1565C0">　PR → レビュー → マージ → CI がデプロイ</text>
  <text x="1014" y="160" font-size="12" fill="#1565C0">・エージェントバンク（スキル・プロンプト共有）</text>
  <text x="1014" y="180" font-size="12" fill="#1565C0">・searchWeb（AI Search 検索ツール）</text>

  <!-- Band1 arrows -->
  <line x1="460" y1="135" x2="536" y2="135" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="468" y="126" font-size="11" fill="#374151">push</text>
  <path d="M 660 200 L 660 232 L 350 232 L 350 256" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="396" y="224" font-size="11.5" fill="#374151">main → 本番デプロイ</text>
  <path d="M 780 200 L 780 232 L 1030 232 L 1030 256" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="846" y="224" font-size="11.5" fill="#374151">develop → 開発デプロイ</text>

  <!-- ============ Band 2: 実行環境 ============ -->
  <!-- 本番 -->
  <rect x="40" y="260" width="680" height="330" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="56" y="288" font-size="14.5" font-weight="700" fill="#E65100">本番 — os.cherie-lab.com（deployment.jsonc）</text>

  <rect x="56" y="300" width="320" height="160" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="70" y="324" font-size="13.5" font-weight="700" fill="#B26A00">cloudflare-os-workshop（本体 Worker）</text>
  <text x="70" y="346" font-size="11.5" fill="#7A4E00">・認証（パスワード方式・ADMINS=["cherie"]）</text>
  <text x="70" y="364" font-size="11.5" fill="#7A4E00">・DO + SQLite（User / Workspace / Gadget）</text>
  <text x="70" y="382" font-size="11.5" fill="#7A4E00">・カタログ: deepseek-v4-flash 自動表示</text>
  <text x="70" y="400" font-size="11.5" fill="#7A4E00">・pi-ai 推論 / エージェント（webFetch 等）</text>
  <text x="70" y="424" font-size="11" font-weight="600" fill="#B26A00">シークレット:</text>
  <text x="70" y="440" font-size="11" fill="#7A4E00">CF_AI_GATEWAY_API_TOKEN</text>

  <rect x="392" y="300" width="312" height="160" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="406" y="324" font-size="13.5" font-weight="700" fill="#B26A00">補助 Worker ×3</text>
  <text x="406" y="346" font-size="11.5" fill="#7A4E00">cloudflare-os-context（Context Library）</text>
  <text x="406" y="364" font-size="11.5" fill="#7A4E00">cloudflare-os-custom（custom-gatekeeper）</text>
  <text x="406" y="382" font-size="11.5" fill="#7A4E00">cloudflare-os-error-reporter</text>
  <text x="406" y="406" font-size="11" font-weight="600" fill="#B26A00">バインディング:</text>
  <text x="406" y="424" font-size="11" fill="#7A4E00">Worker Loader / Browser Run / Workers AI</text>
  <text x="406" y="442" font-size="11" fill="#7A4E00">GATEKEEPER_*（service bindings）</text>

  <rect x="56" y="472" width="648" height="104" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="70" y="496" font-size="13" font-weight="700" fill="#37474F">ストレージ（ID 固定・自動プロビジョン済み）</text>
  <text x="70" y="518" font-size="11.5" fill="#455A64">KV ×3: context / avatars / blueprints（名前空間 ID を deployment.jsonc に固定）</text>
  <text x="70" y="536" font-size="11.5" fill="#455A64">R2: blueprint-content　／　Durable Objects（User / Workspace / Gadget DO）</text>

  <!-- 開発 -->
  <rect x="780" y="260" width="680" height="330" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="796" y="288" font-size="14.5" font-weight="700" fill="#B26A00">開発 — os-dev.cherie-lab.com（deployment.dev.jsonc）</text>

  <rect x="796" y="300" width="320" height="160" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="810" y="324" font-size="13.5" font-weight="700" fill="#B26A00">cloudflare-os-workshop-dev</text>
  <text x="810" y="346" font-size="11.5" fill="#7A4E00">・Workers AI 無料カタログのみ（deepseek 不使用）</text>
  <text x="810" y="364" font-size="11.5" fill="#7A4E00">・データ・リソースは完全分離（-dev 名義）</text>
  <text x="810" y="382" font-size="11.5" fill="#7A4E00">・ダミーデータで見た目・ロジック確認</text>
  <text x="810" y="406" font-size="11" font-weight="600" fill="#B26A00">シークレット:</text>
  <text x="810" y="424" font-size="11" fill="#7A4E00">CF_AI_GATEWAY_API_TOKEN</text>

  <rect x="1132" y="300" width="312" height="160" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="1146" y="324" font-size="13.5" font-weight="700" fill="#B26A00">補助 Worker ×3（-dev）</text>
  <text x="1146" y="346" font-size="11.5" fill="#7A4E00">cloudflare-os-context-dev</text>
  <text x="1146" y="364" font-size="11.5" fill="#7A4E00">cloudflare-os-custom-dev</text>
  <text x="1146" y="382" font-size="11.5" fill="#7A4E00">cloudflare-os-error-reporter-dev</text>
  <text x="1146" y="406" font-size="11" font-weight="600" fill="#B26A00">バインディング:</text>
  <text x="1146" y="424" font-size="11" fill="#7A4E00">Worker Loader / Workers AI（同型）</text>

  <rect x="796" y="472" width="648" height="104" rx="8" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="810" y="496" font-size="13" font-weight="700" fill="#37474F">ストレージ（dev 用・自動プロビジョン）</text>
  <text x="810" y="518" font-size="11.5" fill="#455A64">KV / R2 は本番と別リソース（-dev 名義で作成済み）</text>
  <text x="810" y="536" font-size="11.5" fill="#455A64">同一 Cloudflare アカウント → $5/月 据え置き</text>

  <!-- ============ Band 3: モデルチェーン（共有） ============ -->
  <rect x="40" y="640" width="300" height="130" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="54" y="664" font-size="14" font-weight="700" fill="#92400E">AI Gateway（cloudflare-os）</text>
  <text x="54" y="684" font-size="11.5" fill="#92400E">・カタログ設定・利用ログ記録</text>
  <text x="54" y="702" font-size="11.5" fill="#92400E">・Workers AI ルート（タイトル生成）</text>
  <text x="54" y="720" font-size="11.5" fill="#92400E">・custom provider: opencode-go</text>
  <text x="54" y="738" font-size="11" fill="#B45309">（base_url = リレー Worker / BYOK）</text>

  <rect x="400" y="640" width="300" height="130" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5"/>
  <text x="414" y="664" font-size="14" font-weight="700" fill="#B26A00">リレー Worker（共有）</text>
  <text x="414" y="684" font-size="11.5" fill="#7A4E00">cloudflare-os-model-relay</text>
  <text x="414" y="702" font-size="11.5" fill="#7A4E00">POST /v1/* のみ受理・エラー可視化</text>
  <text x="414" y="726" font-size="11" font-weight="600" fill="#B26A00">シークレット:</text>
  <text x="414" y="744" font-size="11" fill="#7A4E00">OPENCODE_GO_API_KEY（キー一元管理）</text>

  <rect x="760" y="640" width="300" height="130" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="774" y="664" font-size="14" font-weight="700" fill="#1B5E20">opencode.ai（Go プラン）</text>
  <text x="774" y="684" font-size="11.5" fill="#2E7D32">https://opencode.ai/zen/go/v1</text>
  <text x="774" y="702" font-size="11.5" fill="#2E7D32">リレー経由の直接 fetch で課金回避（実証済み）</text>

  <rect x="1120" y="640" width="320" height="130" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="1134" y="664" font-size="14" font-weight="700" fill="#1B5E20">DeepSeek V4 Flash</text>
  <text x="1134" y="684" font-size="11.5" fill="#2E7D32">全ユーザーのデフォルトモデル</text>
  <text x="1134" y="702" font-size="11.5" fill="#2E7D32">キー配布なし・カタログ自動表示</text>

  <!-- Band3 arrows -->
  <line x1="200" y1="590" x2="200" y2="636" stroke="#2E7D32" stroke-width="2.6" marker-end="url(#arrGreen)"/>
  <text x="212" y="618" font-size="12" font-weight="700" fill="#1B5E20">本番: チャット推論（deepseek）</text>
  <path d="M 860 590 L 860 626 L 300 626 L 300 636" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="866" y="612" font-size="11.5" fill="#374151">開発: Workers AI 無料モデル</text>
  <line x1="340" y1="705" x2="396" y2="705" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <line x1="700" y1="705" x2="756" y2="705" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <line x1="1060" y1="705" x2="1116" y2="705" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>

  <!-- ============ Legend ============ -->
  <rect x="40" y="820" width="900" height="78" rx="8" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="56" y="842" font-size="12" font-weight="700" fill="#374151">凡例</text>
  <line x1="56" y1="862" x2="96" y2="862" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="104" y="866" font-size="11.5" fill="#374151">緑実線: 稼働中（deepseek: ゲートウェイ → リレー → opencode.ai → DeepSeek）</text>
  <line x1="56" y1="886" x2="96" y2="886" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="104" y="890" font-size="11.5" fill="#374151">黒実線: 稼働中（push/デプロイ・開発の Workers AI ルート）</text>

  <rect x="1000" y="820" width="440" height="78" rx="8" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="1016" y="842" font-size="12" font-weight="700" fill="#374151">更新履歴</text>
  <text x="1016" y="862" font-size="11" fill="#4B5563">2026-08-07 v2: GitHub/CI・本番/開発・構想を追加</text>
  <text x="1016" y="882" font-size="11" fill="#4B5563">2026-08-06 v1: リレー構成（architecture-v1-*.svg 参照）</text>
</svg>
