name: deploy-personal-agent-prototype

on:
  push:
    branches: [codex/personal-agent-prototype]
    paths:
      - 'personal-agent-prototype/**'
      - '.github/workflows/deploy-personal-agent-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install root deployment dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax check
        run: node --check personal-agent-prototype/src/index.js && node --check personal-agent-prototype/home-worker/daemon.mjs
      - name: Deploy dedicated Worker
        run: pnpm exec wrangler deploy --config personal-agent-prototype/wrangler.jsonc
      - name: Verify deployed Worker
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 2 \
            https://personal-agent-prototype-yutaro.cherie0915y.workers.dev/health \
            | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
