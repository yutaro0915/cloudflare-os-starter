name: bump-submodule

# Advances the cloudflare-os gitlink on develop when the OS repo's merge train (or a
# manual dispatch) reports a new develop SHA. The push is authenticated with
# REPO_SYNC_TOKEN (fine-grained PAT) — a GITHUB_TOKEN push would NOT trigger deploy.yml.
# Loop: cloudflare-os merge-train merges -> repository_dispatch here -> bump commit on
# develop -> deploy.yml -> dev environment.

on:
  repository_dispatch:
    types: [submodule-bump]
  workflow_dispatch:
    inputs:
      sha:
        description: cloudflare-os commit SHA (defaults to tip of its develop)
        required: false

concurrency:
  group: bump-submodule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.REPO_SYNC_TOKEN }}

      - name: Bump gitlink
        env:
          GH_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          SHA="${{ github.event.client_payload.sha || github.event.inputs.sha }}"
          if [ -z "$SHA" ]; then
            SHA=$(gh api repos/yutaro0915/cloudflare-os/branches/develop --jq .commit.sha)
          fi
          CURRENT=$(git rev-parse :cloudflare-os)
          if [ "$CURRENT" = "$SHA" ]; then
            echo "gitlink already at $SHA; nothing to do."
            exit 0
          fi
          git config user.name "merge-train[bot]"
          git config user.email "merge-train@users.noreply.github.com"
          git update-index --cacheinfo 160000,"$SHA",cloudflare-os
          git commit -m "chore: bump cloudflare-os to ${SHA:0:7} (auto via merge train)"
          git push origin develop
