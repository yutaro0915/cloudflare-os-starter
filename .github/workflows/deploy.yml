name: deploy

# Deploys from GitHub (never from local):
#   - push to main -> production (os.cherie-lab.com, deployment.jsonc)
#   - manual dispatch with dry_run=true -> check only (tests + build + dry-run), no deploy
#
# Branch model (2026-08-08): trunk-based. Feature branches -> PR into main -> merge -> deploy.
# The old always-on develop environment was removed; per-PR preview environments are the
# planned replacement.
#
# The deploy.mjs script generates the per-worker wrangler configs (all KV/R2/service-binding
# env vars included) from the deployment config, so this workflow just runs it. Secrets are
# re-ensured on every deploy from GitHub Actions secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only (tests + build + dry-run), no real deploy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Human gate: production deploys wait for manual approval in the GitHub UI
    # (Settings > Environments > production, required reviewer).
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install
          pnpm --dir cloudflare-os install

      - name: Check (tests + build + dry-run)
        run: DEPLOYMENT_CONFIG=deployment.jsonc pnpm run check

      - name: Skip deploy in dry_run mode
        if: ${{ inputs.dry_run }}
        run: echo "dry_run mode — deploy skipped"

      - name: Ensure worker secrets (idempotent)
        if: ${{ !inputs.dry_run }}
        env:
          CF_AI_GATEWAY_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_API_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if [ -n "$CF_AI_GATEWAY_API_TOKEN" ]; then
            printf '%s' "$CF_AI_GATEWAY_API_TOKEN" | pnpm exec wrangler secret put CF_AI_GATEWAY_API_TOKEN --name cloudflare-os-workshop
          fi
          if [ -n "$OPENCODE_GO_API_KEY" ]; then
            printf '%s' "$OPENCODE_GO_API_KEY" | pnpm exec wrangler secret put OPENCODE_GO_API_KEY --name cloudflare-os-model-relay
          fi

      - name: Deploy workers (deploy.mjs generates configs + all bindings)
        if: ${{ !inputs.dry_run }}
        run: DEPLOYMENT_CONFIG=deployment.jsonc pnpm deploy

      # The model relay is shared with the AI Gateway routing, single source of truth on main.
      - name: Deploy model relay
        if: ${{ !inputs.dry_run }}
        working-directory: relay
        run: pnpm exec wrangler deploy
